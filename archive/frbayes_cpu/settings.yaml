# ============================================================================
# FRBayes Configuration File
# ============================================================================
# This configuration file controls all aspects of the FRB analysis pipeline.
# All settings can be modified here, and some can be overridden via 
# environment variables at runtime.
#
# Environment Variable Overrides:
# - SLURM_ARRAY_TASK_ID: Overrides max_peaks
# - MODEL_FRB: Overrides model setting
# - PREPROCESSING_MODE: Overrides preprocessing.mode
# - SLURM_JOB_NAME: Used to set base_dir as "chains_<job_name>"
# - FRBAYES_SETTINGS_FILE: Path to this settings file (default: settings.yaml)
# ============================================================================

# ============================================================================
# DATA CONFIGURATION
# ============================================================================

# Path to the input data file (HDF5 format)
# This should contain the FRB observation data to be analyzed
data_file: "/rds/user/sakl2/hpc-work/development/frbayes2/frbayes/data/20191221A_original_data.h5"

# Original data resolution parameters
# These describe the resolution of the raw input data
original_freq_res: 24414.0625  # Frequency resolution in Hz
original_time_res: 0.98304e-3  # Time resolution in seconds

# Desired data resolution after preprocessing
# The data will be resampled to these resolutions
desired_freq_res: 3.125e6      # Target frequency resolution in Hz
desired_time_res: 7.86432e-3   # Target time resolution in seconds

# Frequency range for analysis (in MHz)
# Only data within this frequency range will be analyzed
freq_min: 400                   # Minimum frequency in MHz
freq_max: 800                   # Maximum frequency in MHz

# ============================================================================
# PREPROCESSING CONFIGURATION
# ============================================================================

# Legacy option for backward compatibility
# When True, uses the preprocessing mode specified in preprocessing.mode
use_paper_preprocessing: False

# Preprocessing configuration
preprocessing:
  # Preprocessing mode determines how data is prepared before analysis
  # Options:
  #   - "default": Standard preprocessing with default parameters
  #   - "paper": Preprocessing as described in the paper
  #   - "raw": Minimal preprocessing, closest to raw data
  mode: "default"

# ============================================================================
# MODEL CONFIGURATION
# ============================================================================

# Model type for fitting FRB pulses
# Options:
#   - "emg": Exponentially Modified Gaussian model
#   - "emg_with_baseline": EMG model with baseline offset parameter
#   - "exponential": Simple exponential decay model
#   - "exponential_with_baseline": Exponential with baseline offset
#   - "periodic_emg": EMG model with periodic structure
#   - "periodic": Simple periodic model
model: "emg"

# Maximum number of peaks/pulses to fit
# This can be overridden by SLURM_ARRAY_TASK_ID environment variable
# The algorithm will fit up to this many peaks in the data
max_peaks: 5

# Whether to fit the number of pulses as a parameter
# If True: The model will determine the optimal number of pulses (up to max_peaks)
# If False: The model will always fit exactly max_peaks pulses
fit_pulses: True

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================

# Base directory for output chains and results
# All output files will be saved in subdirectories under this path
# Can be overridden by SLURM_JOB_NAME environment variable
base_dir: "chains"

# Root name for output files
# This will be automatically updated to include model and peak information
# Format: "fit_pulses=<bool>_<model>_npeaks=<max_peaks>"
file_root: "frb_analysis"

# ============================================================================
# PRIOR RANGES
# ============================================================================
# Prior ranges define the parameter space to explore during sampling.
# Each model uses a combination of common priors and model-specific priors.
# Values are typically in normalized units unless otherwise specified.

prior_ranges:
  # --------------------------------------------------------------------------
  # COMMON PRIORS (used by multiple models)
  # --------------------------------------------------------------------------
  
  # Amplitude of each pulse
  # This controls the peak intensity of the pulse
  # Range depends on data normalization and preprocessing mode
  amplitude:
    min: 0.0001    # Minimum amplitude (avoid zero for numerical stability)
    max: 15        # Maximum amplitude
    # Note: For "narrow" prior variants, use max: 0.1
    # Note: For "wide" prior variants, use max: 15
  
  # Decay time constant (tau)
  # Controls the exponential decay rate of the pulse tail
  # Larger values = slower decay
  tau:
    min: 0.1       # Minimum decay constant
    max: 1         # Maximum decay constant
  
  # Pulse arrival time (u)
  # Time at which each pulse peaks (in normalized time units)
  u:
    min: 0.01      # Start of observation window
    max: 4.0       # End of observation window
  
  # Gaussian width parameter (sigma)
  # Controls the intrinsic width of the pulse before exponential modification
  # Smaller values = narrower pulses
  sigma:
    min: 0.00001   # Minimum width (avoid zero)
    max: 0.1       # Maximum width
    # Note: For "narrow" prior variants, use min: 0.009, max: 0.02
    # Note: For "wide" prior variants, use min: 0.000001, max: 1
  
  # --------------------------------------------------------------------------
  # MODEL-SPECIFIC PRIORS
  # --------------------------------------------------------------------------
  
  # EMG (Exponentially Modified Gaussian) specific parameters
  emg:
    # Width parameter specific to EMG model
    # Controls the overall pulse width after exponential modification
    width:
      min: 0.001   # Minimum width
      max: 0.3     # Maximum width
      # Note: For "narrow" variants, keep these values
      # Note: For "wide" variants, use min: 0.01, max: 1
  
  # Exponential model specific parameters
  exponential:
    # Amplitude range specific to exponential model
    # Typically uses smaller amplitudes than EMG
    amplitude:
      min: 0.001   # Minimum amplitude
      max: 0.1     # Maximum amplitude
      # Note: For "wide" variants, may use min: 20, max: 0.1 (check if this is correct)
  
  # Periodic EMG model specific parameters
  periodic_emg:
    # Width for periodic EMG pulses
    # Typically wider range than standard EMG
    width:
      min: 0.01    # Minimum width  
      max: 1.0     # Maximum width
      # Note: For "narrow" variants, use min: 0.05
  
  # Periodic model specific parameters
  periodic:
    # Initial phase/offset for periodic structure
    u0:
      min: 0.001   # Minimum phase offset
      # Maximum is automatically calculated based on max_peaks
    
    # Period of the periodic structure
    period:
      min: 0.001   # Minimum period
      # Maximum is automatically calculated based on max_peaks
  
  # Models with baseline specific parameters
  emg_with_baseline:
    # Baseline offset added to the entire signal
    # Can be negative (signal below zero) or positive
    baseline_offset:
      min: -1.0    # Minimum offset
      max: 1.0     # Maximum offset
      # Note: Some variants use min: -0.5, max: -0.45 for specific cases
  
  exponential_with_baseline:
    # Baseline offset for exponential model
    baseline_offset:
      min: -1.0    # Minimum offset
      max: 1.0     # Maximum offset

# ============================================================================
# PRIOR VARIANTS REFERENCE
# ============================================================================
# The analysis supports three main prior width variants:
#
# 1. DEFAULT: Standard prior ranges for general analysis
#    - Balanced ranges suitable for most FRBs
#    - Used when no specific variant is specified
#
# 2. NARROW: Tighter prior ranges for well-constrained parameters
#    - Smaller amplitude range: max ~0.1 instead of 15
#    - Tighter sigma range: 0.009-0.02 instead of 0.00001-0.1
#    - Use when pulse properties are well-known
#
# 3. WIDE: Broader prior ranges for exploratory analysis
#    - Larger amplitude range: up to 15
#    - Wider sigma range: 0.000001-1
#    - Use for initial exploration or unusual FRBs
#
# To use a variant, modify the prior ranges above according to the
# notes provided for each parameter.
# ============================================================================

# ============================================================================
# PREPROCESSING MODES REFERENCE
# ============================================================================
# The preprocessing mode determines how raw data is prepared:
#
# 1. DEFAULT: Standard preprocessing pipeline
#    - Applies standard filtering and noise reduction
#    - Suitable for most analyses
#
# 2. PAPER: Preprocessing as described in the published paper
#    - Exactly reproduces the paper's methodology
#    - Use for comparison with published results
#
# 3. RAW: Minimal preprocessing
#    - Preserves data closest to original form
#    - Minimal filtering and corrections
#    - Use when you want to work with least processed data
# ============================================================================

# ============================================================================
# RUNTIME NOTES
# ============================================================================
# - The file_root will be automatically updated at runtime to include:
#   "fit_pulses=<bool>_<model>_npeaks=<max_peaks>"
# 
# - When running with SLURM, the SLURM_ARRAY_TASK_ID will override max_peaks
#   allowing parallel runs with different numbers of peaks
#
# - All paths should be absolute paths to avoid issues with working directory
# ============================================================================